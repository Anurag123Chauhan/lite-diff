<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>lite-diff</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d30; --border: #3c3f43; --fg: #d4d4d4; --muted: #8b8f96;
    --accent: #4d8df7; --add-bg: #1f3a28; --add-fg: #9be3a8; --del-bg: #45252a; --del-fg: #f1a1a8;
    --hunk: #6d8fd0; --kw: #c586c0; --str: #ce9178; --com: #6a9955; --num: #b5cea8; --type: #4ec9b0;
    --m-add: #2ea043; --m-mod: #3b82f6; --m-del: #f85149;
    --code-font: 13px/19px Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: var(--side, 320px) 4px 1fr; grid-template-rows: 36px 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header .title { font-weight: 600; }
  header .branch { color: var(--muted); font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .grow { flex: 1; }
  #quick { width: 340px; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 4px 8px; border-radius: 4px; }
  aside { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #resizer { background: var(--border); cursor: col-resize; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; background: none; border: 0; color: var(--muted); padding: 8px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
  .toolbar { display: flex; gap: 6px; padding: 6px 8px; align-items: center; border-bottom: 1px solid var(--border); color: var(--muted); }
  .toolbar select, .toolbar button, button.btn { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .list { flex: 1; overflow: auto; padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
  .row:hover { background: #35383c; }
  .row.sel { background: #2f4a77; box-shadow: inset 3px 0 var(--accent); color: #fff; }
  .row.sel .name { font-weight: 600; }
  .row.sel .dir { color: #b9c6dc; }
  .gs-M { color: #e2c08d; } .gs-A, .gs-U { color: #73c991; } .gs-R, .gs-C { color: #6ea8fe; } .gs-D { color: #f14c4c; text-decoration: line-through; }
  .gs-dir { color: #d7c39a; }
  .gs-dot { color: #e2c08d; font-size: 8px; margin-left: auto; padding-right: 4px; }
  .gs-badge { margin-left: auto; font: 700 11px Consolas, monospace; padding-right: 4px; }
  /* The open file keeps its git colour (brightened) so you can see both "open" and "changed". */
  .row.sel .name.gs-M { color: #ffd479; } .row.sel .name.gs-A, .row.sel .name.gs-U { color: #8ff0a8; } .row.sel .name.gs-R, .row.sel .name.gs-C { color: #a8cbff; }
  .row.sel .gs-badge { filter: brightness(1.25); }
  .row .name { overflow: hidden; text-overflow: ellipsis; }
  .row .dir { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .dot { color: #e2c08d; font-size: 10px; flex: none; }
  .st { font-family: Consolas, monospace; font-weight: 700; width: 14px; text-align: center; flex: none; }
  .st-M { color: #e2c08d; } .st-A, .st-\? { color: #73c991; } .st-D { color: #f14c4c; } .st-R, .st-C { color: #4d8df7; }
  .tw { width: 12px; color: var(--muted); flex: none; text-align: center; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .crumbs { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; min-height: 36px; }
  .crumbs .c { color: var(--muted); cursor: pointer; font-family: Consolas, monospace; font-size: 12px; }
  .crumbs .c:hover { color: var(--fg); text-decoration: underline; }
  .crumbs .c.cur { color: var(--fg); }
  .crumbs .sep { color: var(--border); }
  .crumbs .part-path { flex: 1; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .crumbs .part-meta, .crumbs .part-actions { display: flex; align-items: center; gap: 8px; }
  .crumbs .depth, .crumbs .chg { color: var(--muted); font-size: 12px; font-family: Consolas, monospace; }
  .crumbs .depth.full { color: #e2c08d; }
  .chg .a { color: var(--m-add); } .chg .m { color: var(--m-mod); } .chg .d { color: var(--m-del); }
  #viewWrap { flex: 1; min-height: 0; display: flex; }
  #view { flex: 1; min-width: 0; overflow: auto; font: var(--code-font); position: relative; }
  #view.editing { overflow: hidden; }
  #ruler { width: 12px; flex: none; position: relative; background: #24262a; border-left: 1px solid var(--border); }
  #ruler .r { position: absolute; left: 2px; right: 2px; min-height: 2px; cursor: pointer; border-radius: 1px; }
  #ruler .r.ma { background: var(--m-add); } #ruler .r.mm { background: var(--m-mod); } #ruler .r.md { background: var(--m-del); height: 2px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; font-family: "Segoe UI", sans-serif; }
  table.code { border-collapse: collapse; min-width: 100%; }
  table.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
  table.code td.ln { color: #5f636a; text-align: right; user-select: none; width: 1%; padding: 0 8px; cursor: pointer; position: relative; }
  table.code td.ln:hover { color: var(--fg); }
  tr.add td.tx { background: var(--add-bg); } tr.add td.ln { background: #1a3022; }
  tr.del td.tx { background: var(--del-bg); } tr.del td.ln { background: #3a2024; }
  tr.hunk td { color: var(--hunk); background: #23293a; }
  tr.flash td { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: #5a4d1a; } }
  td.mk { width: 1%; user-select: none; color: var(--muted); padding: 0 2px !important; }
  /* Change markers (vs HEAD or vs main), shared by the read-only view and the editor gutter. */
  .ma { box-shadow: inset -3px 0 var(--m-add); }
  .mm { box-shadow: inset -3px 0 var(--m-mod); }
  .md::before, .mde::after { content: ''; position: absolute; right: 0; border: 4px solid transparent; border-right-color: var(--m-del); }
  .md::before { top: -4px; } .mde::after { bottom: -4px; }
  .k { color: var(--kw); } .s { color: var(--str); } .c-m { color: var(--com); font-style: italic; } .n { color: var(--num); } .t { color: var(--type); }
  body.ctrl #view .i:hover, body.ctrl #view .s.imp:hover { text-decoration: underline; color: var(--accent); cursor: pointer; }
  /* Editor: a transparent textarea over a highlighted copy that only renders the visible lines. */
  .ed { position: absolute; inset: 0; display: flex; background: var(--bg); }
  .ed-gutter { flex: none; position: relative; overflow: hidden; background: var(--bg); color: #5f636a; user-select: none; border-right: 1px solid #2c2e32; font: var(--code-font); }
  .ed-gutter .g-in { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
  .ed-gutter .g { position: relative; height: 19px; text-align: right; padding: 0 8px; font: var(--code-font); }
  .ed-main { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  .ed-hl, .ed-ta { font: var(--code-font); tab-size: 4; font-variant-ligatures: none; letter-spacing: 0; white-space: pre; }
  .ed-hl { position: absolute; left: 0; top: 0; margin: 0; padding: 0 10px; pointer-events: none; will-change: transform; color: var(--fg); }
  .ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; resize: none; border: 0; outline: 0; padding: 4px 10px; overflow: auto;
           background: transparent; color: transparent; caret-color: #fff; }
  .ed-ta::selection { background: rgba(58, 110, 175, .45); color: transparent; }
  body.ctrl .ed-ta { pointer-events: none; }
  body.ctrl .ed-hl { pointer-events: auto; }
  /* Editor tabs */
  #tabbar { display: flex; align-items: stretch; background: #232427; border-bottom: 1px solid var(--border); min-height: 34px; }
  #tabbar[hidden] { display: none; }
  #tabs { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; max-width: 220px; min-width: 0; flex: none; cursor: pointer; color: var(--muted);
         border-right: 1px solid var(--border); border-top: 2px solid transparent; font-size: 12px; user-select: none; }
  .tab:hover { background: #2a2c30; }
  .tab.on { background: var(--bg); color: #fff; border-top-color: var(--accent); }
  .tab.picked { background: #2c3a52; }
  .tab.picked.on { background: #283447; }
  .tab .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .tk { font-size: 10px; color: var(--muted); }
  .tab .tx-close { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); font-size: 14px; line-height: 1; flex: none; }
  .tab .tx-close:hover { background: #3c3f43; color: #fff; }
  /* Unsaved: show a dot instead of the ×, revealing the × on hover (like VS Code). */
  .tab.dirty .tx-close::before { content: '●'; font-size: 10px; }
  .tab.dirty .tx-close > span { display: none; }
  .tab.dirty:hover .tx-close::before { content: none; }
  .tab.dirty:hover .tx-close > span { display: inline; }
  #tabActions { display: flex; align-items: center; gap: 4px; padding: 0 6px; border-left: 1px solid var(--border); }
  #tabActions button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font: inherit; font-size: 12px; white-space: nowrap; }
  #tabActions button:hover { background: #3c3f43; color: #fff; }
  #tabActions button[hidden] { display: none; }
  #tabMenu { position: fixed; z-index: 10; background: #2b2d30; border: 1px solid var(--border); border-radius: 6px; padding: 4px; min-width: 190px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #tabMenu[hidden] { display: none; }
  #tabMenu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; background: none; border: 0; color: var(--fg); text-align: left; padding: 5px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px; }
  #tabMenu button:hover:not(:disabled) { background: #2f4a77; }
  #tabMenu button:disabled { color: #5f636a; cursor: default; }
  #tabMenu kbd { color: var(--muted); background: none; border: 0; }
  #tabMenu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  .row .open-mark { color: var(--accent); font-size: 9px; flex: none; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #3a3d41; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 480px; }
  #toast.show { opacity: 1; }
  .help { color: var(--muted); font-size: 12px; padding: 8px; border-top: 1px solid var(--border); line-height: 1.6; }
  kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <span class="title">lite-diff</span>
  <span class="branch" id="branch"></span>
  <span class="grow"></span>
  <input id="quick" placeholder="Go to file…  (Ctrl+P)" autocomplete="off" spellcheck="false" />
</header>
<aside>
  <div class="tabs">
    <button data-tab="changes" class="on">Changes</button>
    <button data-tab="files">Files</button>
    <button data-tab="find" hidden>Results</button>
  </div>
  <div class="toolbar" id="changesBar">
    <select id="mode" title="What to diff against">
      <option value="working">Uncommitted (vs HEAD)</option>
      <option value="branch">Whole branch (vs main)</option>
    </select>
    <button id="refresh" title="Refresh (R)">⟳</button>
    <span id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <div class="help">
    <kbd>Ctrl</kbd>+click import / identifier → go to definition (also while editing)<br />
    <kbd>Alt</kbd>+<kbd>←</kbd> back · <kbd>Ctrl</kbd>+<kbd>P</kbd> go to file · <kbd>E</kbd> edit · <kbd>Ctrl</kbd>+<kbd>S</kbd> save<br />
    Tabs: <kbd>Ctrl</kbd>+<kbd>W</kbd> close · <kbd>Ctrl</kbd>+<kbd>Tab</kbd> next · <kbd>Ctrl</kbd>+click tabs to select several · right-click for more<br />
    Gutter: <span style="color:var(--m-add)">▌</span>added <span style="color:var(--m-mod)">▌</span>modified <span style="color:var(--m-del)">◂</span>deleted
  </div>
</aside>
<div id="resizer"></div>
<main>
  <div id="tabbar" hidden>
    <div id="tabs" role="tablist"></div>
    <div id="tabActions">
      <button id="closePicked" hidden title="Close the selected tabs">Close selected</button>
      <button id="closeAll" title="Close all tabs (Ctrl+Shift+W)">Close all</button>
    </div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="viewWrap">
    <div id="view"><div class="empty">Pick a changed file on the left.</div></div>
    <div id="ruler" hidden title="Changes in this file"></div>
  </div>
</main>
<div id="tabMenu" hidden role="menu"></div>
<div id="toast"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const toLF = (s) => s.replace(/\r\n?/g, '\n');
const HIGHLIGHT_LIMIT = 400_000;
const CODE_EXT = /\.(m?[jt]sx?|cjs|json|css|scss|less|html|md|yml|yaml|sh|py|go|rs|java|kt|swift|rb|php|c|h|cpp|cs)$/i;
const JS_EXT = /\.(m?[jt]sx?|cjs)$/i;
const LINE_HEIGHT = 19;
const EDITOR_PAD_TOP = 4;
// Lines rendered above/below the viewport so fast scrolling doesn't show gaps.
const OVERSCAN_LINES = 40;
const MARKS_DEBOUNCE_MS = 200;
// Past this many changed lines the diff stops being worth the CPU; the changed span is marked as one block.
const MAX_DIFF_EDITS = 1000;
const MARK_ADD = 1;
const MARK_MOD = 2;

const state = {
  maxDepth: 3,
  tab: 'changes',
  mode: localStorage.getItem('lite-diff-mode') || 'working',
  changes: [],
  expanded: new Set(['']),
  dirCache: new Map(),
  findResults: [],
  // Open editor tabs. Each owns its own Ctrl+click chain and back stack; state.chain/state.back
  // alias the active tab's arrays so navigation code works on whichever tab is showing.
  tabs: [],
  activeTab: null,
  // Tabs Ctrl/Shift+clicked for "Close selected".
  picked: new Set(),
  // Previously active tabs, so Alt+← can return to the tab you came from.
  tabHistory: [],
  // A "chain" starts when you pick something from the sidebar; each Ctrl+click adds a hop.
  chain: [],
  back: [],
  current: null,
  editing: false,
  dirty: false,
  // Unsaved edits survive Ctrl+click navigation: path -> { text, scrollTop }.
  drafts: new Map(),
  ed: null,
};

async function api(path, params = {}, init) {
  const res = await fetch(`${path}?${new URLSearchParams(params)}`, init);
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- tokenizer (good enough for TS/JS/JSON/CSS; no AST, no worker) ----------
const KW = new Set(('abstract as async await break case catch class const continue debugger declare default delete do else enum export extends false finally for from function get if implements import in infer instanceof interface is keyof let namespace new null of private protected public readonly return satisfies set static super switch this throw true try type typeof undefined unique var void while with yield').split(' '));
const TOKEN_RE = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$)|#[^\n]*)|('(?:[^'\\\n]|\\.)*'?|"(?:[^"\\\n]|\\.)*"?|`(?:[^`\\]|\\[\s\S])*`?)|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?n?\b|\b0x[\da-f_]+\b)|([A-Za-z_$][\w$]*)/gi;

function tokenize(text, isJs) {
  const out = [];
  let last = 0;
  for (const m of text.matchAll(TOKEN_RE)) {
    if (m.index > last) out.push(['', text.slice(last, m.index)]);
    let cls;
    if (m[1]) cls = m[1][0] === '#' && isJs ? '' : 'c-m';
    else if (m[2]) cls = 's';
    else if (m[3]) cls = 'n';
    else cls = KW.has(m[4]) ? 'k' : /^[A-Z]/.test(m[4]) ? 'i t' : 'i';
    out.push([cls, m[0]]);
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(['', text.slice(last)]);
  return out;
}

// Split highlighted tokens into per-line HTML, re-opening spans that cross newlines.
function highlightLines(text, path, importSpecs) {
  if (text.length > HIGHLIGHT_LIMIT || !CODE_EXT.test(path)) return text.split('\n').map(esc);
  const lines = [''];
  for (const [cls, raw] of tokenize(text, JS_EXT.test(path))) {
    const extra = cls === 's' && importSpecs?.has(raw.slice(1, -1)) ? ' imp' : '';
    const parts = raw.split('\n');
    parts.forEach((p, i) => {
      if (i) lines.push('');
      if (p) lines[lines.length - 1] += cls ? `<span class="${cls}${extra}">${esc(p)}</span>` : esc(p);
    });
  }
  return lines;
}

// ---------- import map: identifier → { spec, name } ----------
function parseImports(text) {
  const names = new Map();
  const specs = new Set();
  const STMT = /\b(?:import|export)\s+(?:type\s+)?([\s\S]*?)\s*from\s*['"]([^'"]+)['"]|\bimport\s*['"]([^'"]+)['"]|\b(?:import|require)\s*\(\s*['"]([^'"]+)['"]\s*\)/g;
  for (const m of text.matchAll(STMT)) {
    const spec = m[2] || m[3] || m[4];
    specs.add(spec);
    const clause = m[1];
    if (!clause) continue;
    const ns = /\*\s+as\s+([\w$]+)/.exec(clause);
    if (ns) names.set(ns[1], { spec, name: null });
    const braces = /\{([\s\S]*)\}/.exec(clause);
    if (braces) {
      for (const item of braces[1].split(',')) {
        const parts = item.trim().replace(/^type\s+/, '').split(/\s+as\s+/).map((s) => s.trim());
        if (!parts[0]) continue;
        names.set(parts[1] || parts[0], { spec, name: parts[0] });
      }
    }
    const def = /^\s*(?:type\s+)?([A-Za-z_$][\w$]*)\s*(?:,|$)/.exec(clause.replace(/\{[\s\S]*\}/, '').replace(/\*\s+as\s+[\w$]+/, ''));
    if (def && def[1] !== 'type') names.set(def[1], { spec, name: 'default' });
  }
  return { names, specs };
}

function findLocalDeclaration(text, name) {
  const re = new RegExp(`(?:^|[^\\w$.])(?:const|let|var|function\\*?|class|interface|type|enum|namespace)\\s+${name.replace(/\$/g, '\\$')}\\b`, 'm');
  const m = re.exec(text);
  if (!m) return null;
  return text.slice(0, m.index + 1).split('\n').length;
}

// ---------- change markers: Myers line diff of the committed version vs the current text ----------
function myersOps(a, a0, a1, b, b0, b1) {
  const N = a1 - a0;
  const M = b1 - b0;
  const max = N + M;
  if (!max) return [];
  const off = max + 1;
  const v = new Int32Array(2 * max + 3);
  const trace = [];
  const limit = Math.min(max, MAX_DIFF_EDITS);
  for (let d = 0; d <= limit; d++) {
    trace.push(v.slice(off - d, off + d + 1));
    for (let k = -d; k <= d; k += 2) {
      let x = k === -d || (k !== d && v[off + k - 1] < v[off + k + 1]) ? v[off + k + 1] : v[off + k - 1] + 1;
      let y = x - k;
      while (x < N && y < M && a[a0 + x] === b[b0 + y]) {
        x++;
        y++;
      }
      v[off + k] = x;
      if (x >= N && y >= M) {
        const ops = [];
        let cx = N;
        let cy = M;
        for (let dd = d; dd > 0; dd--) {
          const pv = trace[dd];
          const at = (kk) => pv[kk + dd];
          const ck = cx - cy;
          const isInsert = ck === -dd || (ck !== dd && at(ck - 1) < at(ck + 1));
          const prevK = isInsert ? ck + 1 : ck - 1;
          const prevX = at(prevK);
          const prevY = prevX - prevK;
          // [isInsert, a index, b index] where the edit happens: insert b[prevY] or delete a[prevX].
          ops.push([isInsert, a0 + prevX, b0 + prevY]);
          cx = prevX;
          cy = prevY;
        }
        return ops.reverse();
      }
    }
  }
  return null;
}

function computeMarks(baseLines, curLines) {
  const ids = new Map();
  const id = (s) => {
    let n = ids.get(s);
    if (n === undefined) ids.set(s, (n = ids.size));
    return n;
  };
  const a = baseLines.map(id);
  const b = curLines.map(id);
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length;
  let eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) {
    ea--;
    eb--;
  }
  const hunks = [];
  const ops = myersOps(a, s, ea, b, s, eb);
  if (ops) {
    let h = null;
    for (const [isIns, x, y] of ops) {
      if (h && x === h.x + h.dels && y === h.y + h.ins) isIns ? h.ins++ : h.dels++;
      else hunks.push((h = { x, y, dels: isIns ? 0 : 1, ins: isIns ? 1 : 0 }));
    }
  } else {
    hunks.push({ x: s, y: s, dels: ea - s, ins: eb - s });
  }
  const marks = new Uint8Array(b.length);
  const delBefore = new Set();
  let delAtEnd = false;
  const counts = { add: 0, mod: 0, del: 0 };
  for (const h of hunks) {
    if (h.ins) {
      const kind = h.dels ? MARK_MOD : MARK_ADD;
      marks.fill(kind, h.y, h.y + h.ins);
      if (h.dels) {
        counts.mod += Math.min(h.ins, h.dels);
        if (h.ins > h.dels) counts.add += h.ins - h.dels;
        else counts.del += h.dels - h.ins;
      } else counts.add += h.ins;
    } else if (h.dels) {
      counts.del += h.dels;
      if (h.y < b.length) delBefore.add(h.y);
      else delAtEnd = true;
    }
  }
  return { marks, delBefore, delAtEnd, counts };
}

// base: { lines } | { allAdded } | null (no markers)
function marksFor(base, text) {
  if (!base) return null;
  const lines = text.split('\n');
  if (base.allAdded) {
    const marks = new Uint8Array(lines.length).fill(MARK_ADD);
    return { marks, delBefore: new Set(), delAtEnd: false, counts: { add: lines.length, mod: 0, del: 0 } };
  }
  return computeMarks(base.lines, lines);
}

function markClass(info, i, total) {
  if (!info) return '';
  const m = info.marks[i];
  let cls = m === MARK_ADD ? 'ma' : m === MARK_MOD ? 'mm' : '';
  if (info.delBefore.has(i)) cls += ' md';
  if (info.delAtEnd && i === total - 1) cls += ' mde';
  return cls;
}

function renderRuler(info, total) {
  const ruler = $('#ruler');
  const cur = state.current;
  if (!info || cur?.kind !== 'file' || !total) {
    ruler.hidden = true;
    return;
  }
  const pct = (n) => (n / total) * 100;
  const parts = [];
  for (let i = 0; i < info.marks.length; ) {
    const m = info.marks[i];
    if (!m) {
      i++;
      continue;
    }
    let j = i;
    while (j < info.marks.length && info.marks[j] === m) j++;
    parts.push(`<div class="r ${m === MARK_ADD ? 'ma' : 'mm'}" data-line="${i + 1}" style="top:${pct(i)}%;height:${pct(j - i)}%"></div>`);
    i = j;
  }
  for (const i of info.delBefore) parts.push(`<div class="r md" data-line="${i + 1}" style="top:${pct(i)}%"></div>`);
  if (info.delAtEnd) parts.push(`<div class="r md" data-line="${total}" style="top:calc(100% - 2px)"></div>`);
  ruler.innerHTML = parts.join('');
  ruler.hidden = false;
}

// ---------- sidebar ----------
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('#changesBar').style.display = tab === 'changes' ? '' : 'none';
  if (tab === 'files' && state.current) revealInTree(state.current.path);
  renderList();
}

async function loadChanges() {
  try {
    state.changes = (await api('/api/changes', { mode: state.mode })).changes;
  } catch (e) {
    toast(e.message);
  }
  $('#count').textContent = `${state.changes.length} file${state.changes.length === 1 ? '' : 's'}`;
  state.statusByPath = new Map(state.changes.map((c) => [c.path, c.status]));
  state.changedDirs = new Set();
  for (const c of state.changes) {
    for (let i = c.path.indexOf('/'); i > 0; i = c.path.indexOf('/', i + 1)) state.changedDirs.add(c.path.slice(0, i));
  }
  if (state.tab !== 'find') renderList();
}

const STATUS_LABEL = { M: 'Modified', A: 'Added', '?': 'Untracked', D: 'Deleted', R: 'Renamed', C: 'Copied' };

async function loadDir(dir) {
  if (!state.dirCache.has(dir)) state.dirCache.set(dir, (await api('/api/ls', { dir })).entries);
  return state.dirCache.get(dir);
}

function row({ html, title, selected, onClick, indent = 0 }) {
  const el = document.createElement('div');
  el.className = 'row' + (selected ? ' sel' : '');
  el.style.paddingLeft = `${8 + indent * 14}px`;
  el.innerHTML = html;
  if (title) el.title = title;
  if (selected) el.setAttribute('aria-current', 'true');
  el.onclick = onClick;
  return el;
}

const draftDot = (p) => {
  const unsaved = state.drafts.has(p) || (state.dirty && state.current?.path === p);
  if (unsaved) return '<span class="dot" title="Unsaved edits">●</span>';
  // Files with an open tab (other than the active one, which is already highlighted) get a small marker.
  return state.tabs.some((t) => t !== state.activeTab && tabLoc(t).path === p) ? '<span class="open-mark" title="Open in a tab">◆</span>' : '';
};

// Highlight by path whatever the view (diff, file opened via Ctrl+click / Ctrl+P / "Open file").
const isOpen = (p) => state.current?.path === p;

let listSeq = 0;
async function renderList() {
  const seq = ++listSeq;
  const list = $('#list');
  const frag = document.createDocumentFragment();
  if (state.tab === 'changes') {
    if (!state.changes.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No changes.';
      frag.append(empty);
    }
    for (const c of state.changes) {
      const slash = c.path.lastIndexOf('/');
      frag.append(row({
        html: `<span class="st st-${c.status}">${c.status === '?' ? 'U' : c.status}</span><span class="name">${esc(c.path.slice(slash + 1))}</span>${draftDot(c.path)}<span class="dir">${esc(c.path.slice(0, slash))}</span>`,
        title: c.old ? `${c.old} → ${c.path}` : c.path,
        selected: isOpen(c.path),
        onClick: () => startChain({ kind: 'diff', path: c.path, old: c.old, status: c.status }),
      }));
    }
  } else if (state.tab === 'find') {
    for (const p of state.findResults) {
      frag.append(row({ html: `<span class="name">${esc(p)}</span>${draftDot(p)}`, title: p, selected: isOpen(p), onClick: () => startChain({ kind: 'file', path: p }) }));
    }
  } else {
    const walk = async (dir, depth) => {
      for (const e of await loadDir(dir)) {
        const p = dir ? `${dir}/${e.name}` : e.name;
        const open = state.expanded.has(p);
        frag.append(row({
          html: treeRowHtml(e, p, open),
          title: treeRowTitle(e, p),
          indent: depth,
          selected: !e.dir && isOpen(p),
          onClick: () => {
            if (!e.dir) return startChain({ kind: 'file', path: p });
            open ? state.expanded.delete(p) : state.expanded.add(p);
            renderList();
          },
        }));
        if (e.dir && open) await walk(p, depth + 1);
      }
    };
    try {
      await walk('', 0);
    } catch (err) {
      toast(err.message);
    }
  }
  // A newer render started while folders were loading; let that one win.
  if (seq !== listSeq) return;
  const scrollTop = list.scrollTop;
  list.replaceChildren(frag);
  list.scrollTop = scrollTop;
  list.querySelector('.row.sel')?.scrollIntoView({ block: 'nearest' });
}

// Git status colours in the tree, like VS Code: the file name takes its status colour, folders with changes get a dot.
function treeRowHtml(e, p, open) {
  const twisty = `<span class="tw">${e.dir ? (open ? '▾' : '▸') : ''}</span>`;
  if (e.dir) {
    const changed = state.changedDirs?.has(p);
    return `${twisty}<span class="name${changed ? ' gs-dir' : ''}">${esc(e.name)}</span>${changed ? '<span class="gs-dot">●</span>' : ''}`;
  }
  const st = state.statusByPath?.get(p);
  const badge = st ? `<span class="gs-badge st-${st}">${st === '?' ? 'U' : st}</span>` : '';
  return `${twisty}<span class="name${st ? ` gs gs-${st === '?' ? 'U' : st}` : ''}">${esc(e.name)}</span>${draftDot(p)}${badge}`;
}

function treeRowTitle(e, p) {
  if (e.dir) return state.changedDirs?.has(p) ? `${p} — contains changes` : p;
  const st = state.statusByPath?.get(p);
  return st ? `${p} — ${STATUS_LABEL[st] ?? st}` : p;
}

function revealInTree(path) {
  const parts = path.split('/');
  for (let i = 1; i < parts.length; i++) state.expanded.add(parts.slice(0, i).join('/'));
}

// ---------- navigation ----------
// Leaving an edited file keeps its edits as a draft instead of prompting.
function stashDraft() {
  const ed = state.ed;
  if (!ed) return;
  if (state.dirty) state.drafts.set(ed.loc.path, { text: ed.ta.value, scrollTop: ed.ta.scrollTop });
  else state.drafts.delete(ed.loc.path);
}

// ---------- tabs ----------
let tabSeq = 0;
const tabLoc = (t) => t.chain[t.chain.length - 1];
// A tab is "dirty" if it is the live editor with unsaved edits, or it parked a draft.
const tabDirty = (t) => (t === state.activeTab && state.dirty) || t.chain.some((l) => state.drafts.has(l.path) && l.kind === 'file');

function syncActive() {
  const t = state.activeTab;
  state.chain = t ? t.chain : [];
  state.back = t ? t.back : [];
}

// Persist the active tab's chain back onto the tab after navigation reassigns state.chain.
function commitActive() {
  const t = state.activeTab;
  if (!t) return;
  t.chain = state.chain;
  t.back = state.back;
}

const MAX_TAB_HISTORY = 50;
function rememberTab() {
  if (!state.activeTab) return;
  state.tabHistory.push(state.activeTab);
  if (state.tabHistory.length > MAX_TAB_HISTORY) state.tabHistory.shift();
}

function activateTab(t, { fromBack = false } = {}) {
  if (t === state.activeTab) return;
  if (!fromBack) rememberTab();
  state.activeTab = t;
  syncActive();
  show(tabLoc(t));
}

// Sidebar / Ctrl+P: reuse a tab already showing that file, else open a new tab after the active one.
function openInTab(loc) {
  const existing = state.tabs.find((t) => {
    const l = tabLoc(t);
    return l.path === loc.path && l.kind === loc.kind;
  });
  if (existing) {
    if (existing === state.activeTab) {
      if (loc.line) scrollToLine(loc.line);
      return;
    }
    return activateTab(existing);
  }
  const t = { id: ++tabSeq, chain: [loc], back: [] };
  rememberTab();
  const at = state.tabs.indexOf(state.activeTab);
  state.tabs.splice(at < 0 ? state.tabs.length : at + 1, 0, t);
  state.activeTab = t;
  syncActive();
  show(loc);
}

function confirmCloseDirty(tabs) {
  const dirty = tabs.filter(tabDirty);
  if (!dirty.length) return true;
  const names = dirty.map((t) => tabLoc(t).path.split('/').pop()).join(', ');
  return confirm(`${dirty.length === 1 ? `"${names}" has` : `${dirty.length} tabs have`} unsaved changes${dirty.length > 1 ? ` (${names})` : ''}. Close and discard them?`);
}

function closeTabs(tabs) {
  if (!tabs.length || !confirmCloseDirty(tabs)) return;
  const closing = new Set(tabs);
  const active = state.activeTab;
  // Pick the neighbour of the active tab, preferring the right, among the tabs that stay open.
  let next = active;
  if (closing.has(active)) {
    const i = state.tabs.indexOf(active);
    next = state.tabs.slice(i + 1).find((t) => !closing.has(t)) ?? state.tabs.slice(0, i).reverse().find((t) => !closing.has(t)) ?? null;
  }
  for (const t of tabs) {
    for (const l of t.chain) if (!state.tabs.some((o) => !closing.has(o) && o.chain.includes(l))) state.drafts.delete(l.path);
    state.picked.delete(t);
  }
  if (closing.has(active)) {
    // The live editor belongs to the closing tab; drop its edits instead of stashing them.
    state.dirty = false;
    state.ed = null;
  }
  state.tabs = state.tabs.filter((t) => !closing.has(t));
  state.tabHistory = state.tabHistory.filter((t) => !closing.has(t));
  if (next !== active) {
    state.activeTab = next;
    syncActive();
    if (next) show(tabLoc(next));
    else showEmpty();
  } else {
    renderTabs();
    renderList();
  }
}

const closeTab = (t) => closeTabs([t]);
const closeOthers = (t) => closeTabs(state.tabs.filter((o) => o !== t));
const closeToRight = (t) => closeTabs(state.tabs.slice(state.tabs.indexOf(t) + 1));
const closeSaved = () => closeTabs(state.tabs.filter((t) => !tabDirty(t)));
const closeAll = () => closeTabs(state.tabs.slice());

function showEmpty() {
  ++showSeq;
  state.current = null;
  state.editing = false;
  state.dirty = false;
  state.ed = null;
  state.chain = [];
  state.back = [];
  $('#view').classList.remove('editing');
  $('#ruler').hidden = true;
  $('#view').innerHTML = '<div class="empty">No open files. Pick a file on the left, or press Ctrl+P.</div>';
  renderCrumbs();
  renderTabs();
  renderList();
}

function renderTabs() {
  const bar = $('#tabbar');
  bar.hidden = state.tabs.length === 0;
  const html = state.tabs
    .map((t) => {
      const l = tabLoc(t);
      const name = l.path.split('/').pop();
      const cls = ['tab', t === state.activeTab && 'on', state.picked.has(t) && 'picked', tabDirty(t) && 'dirty'].filter(Boolean).join(' ');
      return `<div class="${cls}" role="tab" aria-selected="${t === state.activeTab}" data-id="${t.id}" title="${esc(l.path)}${tabDirty(t) ? ' — unsaved' : ''}">` +
        `<span class="tn">${esc(name)}</span>${l.kind === 'diff' ? '<span class="tk">diff</span>' : ''}` +
        `<span class="tx-close" data-close="${t.id}" title="Close (Ctrl+W)"><span>×</span></span></div>`;
    })
    .join('');
  const tabsEl = $('#tabs');
  if (tabsEl.dataset.v !== html) {
    tabsEl.innerHTML = html;
    tabsEl.dataset.v = html;
  }
  const picked = state.picked.size;
  $('#closePicked').hidden = picked < 1;
  $('#closePicked').textContent = `Close selected (${picked})`;
  tabsEl.querySelector('.tab.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

const tabById = (id) => state.tabs.find((t) => t.id === Number(id));

function openTabMenu(t, x, y) {
  const menu = $('#tabMenu');
  const i = state.tabs.indexOf(t);
  const picked = [...state.picked];
  const items = [
    ['close', 'Close', 'Ctrl+W', true],
    ['others', 'Close Others', '', state.tabs.length > 1],
    ['right', 'Close to the Right', '', i < state.tabs.length - 1],
    ['saved', 'Close Saved', '', state.tabs.some((o) => !tabDirty(o))],
    ['all', 'Close All', '', true],
  ];
  menu.innerHTML =
    (picked.length > 1 ? `<button data-act="picked">Close ${picked.length} Selected<kbd></kbd></button><hr>` : '') +
    items.map(([act, label, key, on]) => `<button data-act="${act}" ${on ? '' : 'disabled'}>${label}<kbd>${key}</kbd></button>`).join('');
  menu.dataset.id = t.id;
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = `${Math.min(x, innerWidth - r.width - 4)}px`;
  menu.style.top = `${Math.min(y, innerHeight - r.height - 4)}px`;
  menu.querySelector('button:not(:disabled)')?.focus();
}

const closeTabMenu = () => ($('#tabMenu').hidden = true);

function startChain(loc) {
  openInTab(loc);
}

function hop(loc) {
  const hops = state.chain.length - 1;
  if (hops >= state.maxDepth) {
    toast(`Ctrl+click depth limit (${state.maxDepth}) reached. Open the file from the sidebar or Ctrl+P to start a new chain.`);
    return;
  }
  state.back.push({ chain: state.chain, loc: state.current });
  state.chain = [...state.chain, loc];
  commitActive();
  show(loc);
}

function goBack() {
  const prev = state.back.pop();
  if (prev) {
    state.chain = prev.chain;
    commitActive();
    show(prev.loc);
    return;
  }
  // Nothing left in this tab: go back to the tab you came from, like VS Code's Go Back.
  while (state.tabHistory.length) {
    const t = state.tabHistory.pop();
    if (t !== state.activeTab && state.tabs.includes(t)) return activateTab(t, { fromBack: true });
  }
}

function jumpToCrumb(i) {
  if (i === state.chain.length - 1) return;
  state.back.push({ chain: state.chain, loc: state.current });
  state.chain = state.chain.slice(0, i + 1);
  commitActive();
  show(state.chain[i]);
}

function changeSummary() {
  const c = state.current?.marks?.counts;
  if (!c || !(c.add || c.mod || c.del)) return '';
  const vs = state.mode === 'branch' ? 'main' : 'HEAD';
  return `<span class="chg" title="Lines changed vs ${vs}"><span class="a">+${c.add}</span> <span class="m">~${c.mod}</span> <span class="d">−${c.del}</span> vs ${vs}</span>`;
}

// Each part only re-renders when its own HTML changes, so a button is never swapped out mid-click.
const crumbParts = new Map();
function setPart(name, html) {
  let el = crumbParts.get(name);
  if (!el) {
    el = document.createElement('span');
    el.className = `part-${name}`;
    crumbParts.set(name, el);
    $('#crumbs').append(el);
  }
  if (el.dataset.v !== html) {
    el.innerHTML = html;
    el.dataset.v = html;
  }
}

function renderCrumbs() {
  const hops = state.chain.length - 1;
  const cur = state.current;
  const parts = state.chain.map((loc, i) => {
    const isCur = i === state.chain.length - 1;
    const unsaved = (isCur && state.dirty) || (!isCur && state.drafts.has(loc.path)) ? '● ' : '';
    const name = unsaved + loc.path.split('/').pop() + (loc.kind === 'diff' ? ' (diff)' : '');
    return `${i ? '<span class="sep">›</span>' : ''}<span class="c${isCur ? ' cur' : ''}" data-i="${i}" title="${esc(loc.path)}">${esc(name)}</span>`;
  });
  // Only offer Edit once the file's text has loaded; before that startEdit() has nothing to edit.
  const canEdit = cur?.kind === 'file' && !cur.readonly && cur.text != null;
  setPart('path', parts.join(''));
  setPart('meta', `${changeSummary()}
    ${cur ? `<span class="depth${hops >= state.maxDepth ? ' full' : ''}" title="Ctrl+click hops used in this chain">depth ${hops}/${state.maxDepth}</span>` : ''}`);
  setPart('actions', `${cur?.kind === 'diff' && cur.status !== 'D' ? '<button class="btn" id="openFile">Open file</button>' : ''}
    ${canEdit && !state.editing ? '<button class="btn" id="edit">Edit (E)</button>' : ''}
    ${state.editing ? '<button class="btn" id="save">Save (Ctrl+S)</button><button class="btn" id="cancel">Discard</button>' : ''}`);
}

// Delegated so buttons keep working when their part re-renders.
$('#crumbs').addEventListener('click', (e) => {
  const cur = state.current;
  const crumb = e.target.closest('.c');
  if (crumb) return jumpToCrumb(Number(crumb.dataset.i));
  switch (e.target.closest('button')?.id) {
    case 'openFile':
      return hopOrStart({ kind: 'file', path: cur.path, old: cur.old });
    case 'edit':
      return startEdit();
    case 'save':
      return save();
    case 'cancel':
      return discardEdits();
  }
});

// Opening the file behind a diff isn't a "definition" jump, so it doesn't spend depth.
function hopOrStart(loc) {
  if (!state.activeTab) return openInTab(loc);
  state.back.push({ chain: state.chain, loc: state.current });
  state.chain = [...state.chain.slice(0, -1), loc];
  commitActive();
  show(loc);
}

async function loadBase(loc) {
  try {
    const b = await api('/api/base', { path: loc.path, old: loc.old || '', mode: state.mode });
    if (b.content != null) return { lines: toLF(b.content).split('\n') };
    if (b.exists === false && !b.ignored) return { allAdded: true };
  } catch {
    // Markers are a nice-to-have; the file still opens without them.
  }
  return null;
}

let showSeq = 0;
async function show(loc) {
  stashDraft();
  const seq = ++showSeq;
  state.current = loc;
  state.editing = false;
  state.dirty = false;
  state.ed = null;
  $('#view').classList.remove('editing');
  $('#ruler').hidden = true;
  // A revisited file reloads fresh, so don't offer Edit on its stale text in the meantime.
  if (loc.kind === 'file') loc.text = null;
  renderCrumbs();
  renderTabs();
  // Expand the tree to the open file even when another tab is showing, so it's already there on switch.
  revealInTree(loc.path);
  renderList();
  const view = $('#view');
  view.innerHTML = '<div class="empty">Loading…</div>';
  try {
    if (loc.kind === 'diff') {
      const { diff } = await api('/api/diff', { path: loc.path, old: loc.old || '', mode: state.mode });
      if (seq !== showSeq) return;
      if (loc.status === '?') return renderUntracked(loc, seq);
      renderDiff(diff, loc);
    } else {
      const [data, base] = await Promise.all([api('/api/file', { path: loc.path }), loadBase(loc)]);
      if (seq !== showSeq) return;
      if (data.tooLarge || data.binary) {
        loc.readonly = true;
        renderCrumbs();
        view.innerHTML = `<div class="empty">${data.binary ? 'Binary file' : 'File too large to show'} (${(data.size / 1024).toFixed(0)} KB)</div>`;
        return;
      }
      loc.eol = data.content.includes('\r\n') ? '\r\n' : '\n';
      loc.text = toLF(data.content);
      loc.base = base;
      loc.marks = marksFor(base, loc.text);
      loc.imports = null;
      renderCrumbs();
      const draft = state.drafts.get(loc.path);
      if (draft) startEdit(draft);
      else renderFile(loc);
    }
  } catch (e) {
    if (seq === showSeq) view.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function renderUntracked(loc, seq) {
  const data = await api('/api/file', { path: loc.path });
  if (seq !== showSeq) return;
  if (data.content == null) {
    $('#view').innerHTML = '<div class="empty">New file (binary or too large to show)</div>';
    return;
  }
  const lines = toLF(data.content).replace(/\n$/, '').split('\n');
  const diff = `@@ -0,0 +1,${lines.length} @@ new file\n` + lines.map((l) => '+' + l).join('\n');
  renderDiff(diff, loc);
}

function renderDiff(diff, loc) {
  const view = $('#view');
  if (!diff.trim()) {
    view.innerHTML = '<div class="empty">No textual changes (mode change or binary).</div>';
    return;
  }
  const rows = [];
  let oldN = 0;
  let newN = 0;
  let started = false;
  for (const raw of diff.split('\n')) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('@@')) {
      started = true;
      const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(line);
      if (m) [oldN, newN] = [Number(m[1]), Number(m[2])];
      rows.push(`<tr class="hunk"><td class="ln"></td><td class="ln"></td><td class="mk"></td><td class="tx">${esc(line)}</td></tr>`);
      continue;
    }
    if (!started || line.startsWith('\\')) continue;
    const kind = line[0];
    const body = highlightLines(line.slice(1), loc.path)[0] ?? '';
    if (kind === '+') rows.push(`<tr class="add"><td class="ln"></td><td class="ln" data-line="${newN}">${newN++}</td><td class="mk">+</td><td class="tx">${body}</td></tr>`);
    else if (kind === '-') rows.push(`<tr class="del"><td class="ln">${oldN++}</td><td class="ln"></td><td class="mk">-</td><td class="tx">${body}</td></tr>`);
    else if (kind === ' ') rows.push(`<tr><td class="ln">${oldN++}</td><td class="ln" data-line="${newN}">${newN++}</td><td class="mk"></td><td class="tx">${body}</td></tr>`);
  }
  view.innerHTML = `<table class="code">${rows.join('')}</table>`;
  view.scrollTop = 0;
}

function renderFile(loc) {
  const view = $('#view');
  const { specs } = JS_EXT.test(loc.path) ? (loc.imports ??= parseImports(loc.text)) : { specs: null };
  const lines = highlightLines(loc.text, loc.path, specs);
  const info = loc.marks;
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    html += `<tr id="L${i + 1}"><td class="ln ${markClass(info, i, lines.length)}" data-line="${i + 1}">${i + 1}</td><td class="tx">${lines[i] || ' '}</td></tr>`;
  }
  view.innerHTML = `<table class="code">${html}</table>`;
  renderRuler(info, lines.length);
  scrollToLine(loc.line);
}

function scrollToLine(line) {
  if (state.ed) return editorGoToLine(line);
  const view = $('#view');
  if (!line || line <= 1) {
    view.scrollTop = 0;
    return;
  }
  const tr = document.getElementById(`L${line}`);
  if (!tr) return;
  view.scrollTop = Math.max(0, tr.offsetTop - view.clientHeight / 3);
  tr.classList.add('flash');
}

// ---------- ctrl+click ----------
async function fileTextFor(loc) {
  if (state.ed && state.ed.loc === loc) return state.ed.ta.value;
  if (loc.kind === 'file' && loc.text != null) return loc.text;
  const data = await api('/api/file', { path: loc.path });
  return toLF(data.content ?? '');
}

async function onCtrlClick(target) {
  const cur = state.current;
  if (!cur || cur.status === 'D') return;
  const word = target.textContent;
  try {
    if (target.classList.contains('s')) {
      const spec = word.replace(/^['"`]|['"`]$/g, '');
      const hit = await api('/api/resolve', { from: cur.path, spec });
      return hop({ kind: 'file', path: hit.path, line: hit.line });
    }
    if (!target.classList.contains('i')) return;
    const text = await fileTextFor(cur);
    const imp = parseImports(text).names.get(word);
    if (imp) {
      const hit = await api('/api/resolve', { from: cur.path, spec: imp.spec, name: imp.name || '' });
      return hop({ kind: 'file', path: hit.path, line: hit.line });
    }
    const line = findLocalDeclaration(text, word);
    if (!line) return toast(`No import or declaration found for "${word}"`);
    // Same-file jumps are free: they don't use up depth.
    if (cur.kind === 'file') {
      cur.line = line;
      scrollToLine(line);
    } else {
      hopOrStart({ kind: 'file', path: cur.path, line });
    }
  } catch (e) {
    toast(e.message);
  }
}

// ---------- editing ----------
function startEdit(draft) {
  const cur = state.current;
  if (cur?.kind !== 'file' || cur.readonly || cur.text == null) return;
  const view = $('#view');
  const startScroll = draft?.scrollTop ?? view.scrollTop;
  state.editing = true;
  state.dirty = Boolean(draft);

  const host = document.createElement('div');
  host.className = 'ed';
  host.innerHTML = '<div class="ed-gutter"><div class="g-in"></div></div><div class="ed-main"><pre class="ed-hl"></pre><textarea class="ed-ta" id="editor" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>';
  const ta = host.querySelector('textarea');
  ta.value = draft?.text ?? cur.text;
  const ed = {
    loc: cur,
    ta,
    hl: host.querySelector('.ed-hl'),
    gutter: host.querySelector('.ed-gutter'),
    gutterInner: host.querySelector('.g-in'),
    lines: ta.value.split('\n'),
    specs: JS_EXT.test(cur.path) ? parseImports(ta.value).specs : null,
    marks: draft ? marksFor(cur.base, ta.value) : cur.marks,
    frame: 0,
    marksTimer: 0,
  };
  state.ed = ed;
  cur.marks = ed.marks;
  view.classList.add('editing');
  view.replaceChildren(host);
  renderCrumbs();

  ta.addEventListener('scroll', () => scheduleEditorRender(ed));
  ta.addEventListener('input', () => {
    ed.lines = ta.value.split('\n');
    if (!state.dirty) {
      state.dirty = true;
      renderCrumbs();
      renderTabs();
    }
    renderEditorWindow(ed);
    clearTimeout(ed.marksTimer);
    ed.marksTimer = setTimeout(() => refreshEditorMarks(ed), MARKS_DEBOUNCE_MS);
  });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      document.execCommand('insertText', false, '  ');
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) {
      const lineStart = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
      const indent = /^[ \t]*/.exec(ta.value.slice(lineStart, ta.selectionStart))[0];
      e.preventDefault();
      document.execCommand('insertText', false, '\n' + indent);
    }
  });
  new ResizeObserver(() => scheduleEditorRender(ed)).observe(ta);

  ta.scrollTop = startScroll;
  renderEditorWindow(ed);
  renderRuler(ed.marks, ed.lines.length);
  ta.focus({ preventScroll: true });
}

function scheduleEditorRender(ed) {
  if (ed.frame) return;
  ed.frame = requestAnimationFrame(() => {
    ed.frame = 0;
    renderEditorWindow(ed);
  });
}

// Only the visible lines (plus overscan) are highlighted and in the DOM, so big files stay cheap.
function renderEditorWindow(ed) {
  if (state.ed !== ed) return;
  const { ta, lines } = ed;
  const total = lines.length;
  const first = Math.max(0, Math.floor((ta.scrollTop - EDITOR_PAD_TOP) / LINE_HEIGHT) - OVERSCAN_LINES);
  const last = Math.min(total, Math.ceil((ta.scrollTop + ta.clientHeight) / LINE_HEIGHT) + OVERSCAN_LINES);
  const html = highlightLines(lines.slice(first, last).join('\n'), ed.loc.path, ed.specs);
  ed.hl.innerHTML = html.join('\n') + '\n';
  const y = first * LINE_HEIGHT + EDITOR_PAD_TOP - ta.scrollTop;
  ed.hl.style.transform = `translate(${-ta.scrollLeft}px, ${y}px)`;
  let g = '';
  for (let i = first; i < last; i++) g += `<div class="g ${markClass(ed.marks, i, total)}">${i + 1}</div>`;
  ed.gutterInner.innerHTML = g;
  ed.gutterInner.style.transform = `translateY(${y}px)`;
  ed.gutter.style.width = `${String(total).length + 3}ch`;
}

function refreshEditorMarks(ed) {
  if (state.ed !== ed) return;
  ed.marks = marksFor(ed.loc.base, ed.ta.value);
  ed.loc.marks = ed.marks;
  if (ed.specs) ed.specs = parseImports(ed.ta.value).specs;
  renderEditorWindow(ed);
  renderRuler(ed.marks, ed.lines.length);
  renderCrumbs();
}

function editorGoToLine(line) {
  const ed = state.ed;
  if (!ed || !line) return;
  const { ta } = ed;
  ta.scrollTop = Math.max(0, (line - 1) * LINE_HEIGHT - ta.clientHeight / 3);
  let pos = 0;
  for (let i = 1; i < line && pos !== -1; i++) pos = ta.value.indexOf('\n', pos) + 1 || -1;
  if (pos >= 0) ta.setSelectionRange(pos, pos);
  ta.focus({ preventScroll: true });
  renderEditorWindow(ed);
}

function discardEdits() {
  const cur = state.current;
  if (state.dirty && !confirm('Discard unsaved changes?')) return;
  state.dirty = false;
  state.drafts.delete(cur.path);
  show(cur);
}

async function save() {
  const cur = state.current;
  const ed = state.ed;
  if (!ed || !cur) return;
  const text = ed.ta.value;
  try {
    // Textareas always use \n; keep the file's own line endings so the whole file doesn't show as changed.
    const body = cur.eol === '\r\n' ? text.replace(/\n/g, '\r\n') : text;
    await api('/api/save', { path: cur.path }, { method: 'POST', body, headers: { 'x-lite-diff': '1' } });
    cur.text = text;
    cur.imports = null;
    cur.marks = marksFor(cur.base, text);
    cur.line = Math.floor(ed.ta.scrollTop / LINE_HEIGHT) + 1;
    state.drafts.delete(cur.path);
    state.editing = false;
    state.dirty = false;
    state.ed = null;
    $('#view').classList.remove('editing');
    toast('Saved');
    renderCrumbs();
    renderTabs();
    renderFile(cur);
    loadChanges();
  } catch (e) {
    toast(`Save failed: ${e.message}`);
  }
}

// ---------- quick open ----------
let findTimer;
$('#quick').addEventListener('input', (e) => {
  clearTimeout(findTimer);
  const q = e.target.value.trim();
  if (!q) {
    document.querySelector('[data-tab="find"]').hidden = true;
    if (state.tab === 'find') setTab('changes');
    return;
  }
  findTimer = setTimeout(async () => {
    try {
      state.findResults = (await api('/api/find', { q })).files;
      document.querySelector('[data-tab="find"]').hidden = false;
      setTab('find');
    } catch (err) {
      toast(err.message);
    }
  }, 150);
});
$('#quick').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && state.findResults[0]) {
    startChain({ kind: 'file', path: state.findResults[0] });
    e.target.blur();
  } else if (e.key === 'Escape') {
    e.target.value = '';
    e.target.dispatchEvent(new Event('input'));
    e.target.blur();
  }
});

// ---------- wiring ----------
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));
$('#mode').value = state.mode;
$('#mode').onchange = (e) => {
  state.mode = e.target.value;
  localStorage.setItem('lite-diff-mode', state.mode);
  loadChanges();
  if (state.current) show(state.current);
};
$('#refresh').onclick = () => {
  state.dirCache.clear();
  loadChanges();
  if (state.current && !state.editing) show(state.current);
};

$('#view').addEventListener('click', (e) => {
  const ln = e.target.closest('td.ln[data-line]');
  if (ln && state.current?.kind === 'diff' && state.current.status !== 'D') {
    return hopOrStart({ kind: 'file', path: state.current.path, old: state.current.old, line: Number(ln.dataset.line) });
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  const tok = e.target.closest('.i, .s');
  if (tok) {
    e.preventDefault();
    onCtrlClick(tok);
  }
});
// Tabs: click to switch, Ctrl/Shift+click to multi-select, × or middle-click to close, right-click for the menu.
let lastPickedTab = null;
$('#tabs').addEventListener('click', (e) => {
  const el = e.target.closest('.tab');
  if (!el) return;
  const t = tabById(el.dataset.id);
  if (e.target.closest('[data-close]')) {
    e.stopPropagation();
    return closeTab(t);
  }
  if (e.ctrlKey || e.metaKey) {
    state.picked.has(t) ? state.picked.delete(t) : state.picked.add(t);
    lastPickedTab = t;
    return renderTabs();
  }
  if (e.shiftKey && lastPickedTab) {
    const [a, b] = [state.tabs.indexOf(lastPickedTab), state.tabs.indexOf(t)].sort((x, y) => x - y);
    for (const o of state.tabs.slice(a, b + 1)) state.picked.add(o);
    return renderTabs();
  }
  if (state.picked.size) state.picked.clear();
  lastPickedTab = t;
  activateTab(t);
  renderTabs();
});
$('#tabs').addEventListener('auxclick', (e) => {
  const el = e.target.closest('.tab');
  if (el && e.button === 1) {
    e.preventDefault();
    closeTab(tabById(el.dataset.id));
  }
});
// Stop the middle button starting autoscroll on the tab strip.
$('#tabs').addEventListener('mousedown', (e) => e.button === 1 && e.preventDefault());
$('#tabs').addEventListener('contextmenu', (e) => {
  const el = e.target.closest('.tab');
  if (!el) return;
  e.preventDefault();
  const t = tabById(el.dataset.id);
  // Right-clicking an unpicked tab acts on that tab alone, like a file manager.
  if (!state.picked.has(t)) state.picked.clear();
  renderTabs();
  openTabMenu(t, e.clientX, e.clientY);
});
$('#tabMenu').addEventListener('click', (e) => {
  const act = e.target.closest('button:not(:disabled)')?.dataset.act;
  if (!act) return;
  const t = tabById($('#tabMenu').dataset.id);
  closeTabMenu();
  if (!t) return;
  ({
    close: () => closeTab(t),
    others: () => closeOthers(t),
    right: () => closeToRight(t),
    saved: closeSaved,
    all: closeAll,
    picked: () => closeTabs([...state.picked]),
  })[act]();
});
addEventListener('mousedown', (e) => !e.target.closest('#tabMenu') && closeTabMenu());
addEventListener('resize', closeTabMenu);
$('#closePicked').onclick = () => closeTabs([...state.picked]);
$('#closeAll').onclick = closeAll;

function cycleTab(dir) {
  const n = state.tabs.length;
  if (n < 2) return;
  const i = state.tabs.indexOf(state.activeTab);
  activateTab(state.tabs[(i + dir + n) % n]);
}

$('#ruler').addEventListener('click', (e) => {
  const r = e.target.closest('.r[data-line]');
  if (r) scrollToLine(Number(r.dataset.line));
});

addEventListener('keydown', (e) => {
  if (e.key === 'Control' || e.key === 'Meta') document.body.classList.add('ctrl');
  const typing = e.target.matches('input, textarea, select');
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (e.key === 'Escape' && !$('#tabMenu').hidden) {
    closeTabMenu();
  } else if (e.key === 'Escape' && state.picked.size && !typing) {
    state.picked.clear();
    renderTabs();
  } else if (mod && e.shiftKey && key === 'w') {
    e.preventDefault();
    closeAll();
  } else if (mod && key === 'w') {
    // Ctrl+W closes the selected tabs if any, else the active tab (never the window).
    e.preventDefault();
    if (state.picked.size) closeTabs([...state.picked]);
    else if (state.activeTab) closeTab(state.activeTab);
  } else if ((mod && e.key === 'Tab') || (mod && (e.key === 'PageDown' || e.key === 'PageUp'))) {
    e.preventDefault();
    cycleTab(e.shiftKey || e.key === 'PageUp' ? -1 : 1);
  } else if (e.altKey && /^[1-9]$/.test(e.key)) {
    e.preventDefault();
    const t = e.key === '9' ? state.tabs[state.tabs.length - 1] : state.tabs[Number(e.key) - 1];
    if (t) activateTab(t);
  } else if (mod && key === 's') {
    e.preventDefault();
    if (state.editing) save();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
    e.preventDefault();
    $('#quick').focus();
    $('#quick').select();
  } else if (e.altKey && e.key === 'ArrowLeft') {
    e.preventDefault();
    goBack();
  } else if (!typing && e.key.toLowerCase() === 'e' && !e.ctrlKey && !e.altKey) {
    startEdit();
  } else if (!typing && e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.altKey) {
    $('#refresh').click();
  }
});
addEventListener('keyup', (e) => {
  if (e.key === 'Control' || e.key === 'Meta') document.body.classList.remove('ctrl');
});
addEventListener('blur', () => document.body.classList.remove('ctrl'));
addEventListener('mouseup', (e) => e.button === 3 && goBack());
addEventListener('beforeunload', (e) => {
  if (state.dirty || state.drafts.size) e.preventDefault();
});

const resizer = $('#resizer');
resizer.addEventListener('pointerdown', (e) => {
  resizer.setPointerCapture(e.pointerId);
  const move = (ev) => document.body.style.setProperty('--side', `${Math.min(700, Math.max(180, ev.clientX))}px`);
  resizer.addEventListener('pointermove', move);
  resizer.addEventListener('pointerup', () => resizer.removeEventListener('pointermove', move), { once: true });
});

(async () => {
  try {
    const info = await api('/api/info');
    state.maxDepth = info.maxDepth;
    $('#branch').textContent = `${info.branch}  ·  ${info.root}`;
    document.title = `lite-diff · ${info.branch}`;
  } catch (e) {
    toast(e.message);
  }
  setTab('changes');
  loadChanges();
})();
</script>
</body>
</html>
